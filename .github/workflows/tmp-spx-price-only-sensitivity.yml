name: Temporary SPX price-only leveraged sensitivity

on:
  push:
    branches:
      - audit/exact-monthly-signal
    paths:
      - ".github/workflows/tmp-spx-price-only-sensitivity.yml"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download public model inputs
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/ravelab/l-etf/main/data/index-sp.csv -o /tmp/index-sp.csv
          curl -fsSL https://raw.githubusercontent.com/ravelab/l-etf/main/data/rate-borrow.csv -o /tmp/rate-borrow.csv

      - name: Calculate total-return and price-only sensitivity
        shell: bash
        run: |
          python - <<'PY'
          import bisect, csv, json
          from datetime import date

          START = "1985-01-31"
          END = "2026-08-27"
          PERIODS = {
              "full": ("1985-01-31", "2026-08-27"),
              "1985-1999": ("1985-01-31", "1999-12-31"),
              "2000-2009": ("2000-01-03", "2009-12-31"),
              "2010-2026": ("2010-01-04", "2026-08-27"),
          }
          CONFIGS = {
              "SSO": {"leverage": 2, "expense_pct": 0.91, "rate_sensitivity": 0.713561, "base_spread": 0.002114},
              "UPRO": {"leverage": 3, "expense_pct": 0.91, "rate_sensitivity": 0.734562, "base_spread": 0.003632},
          }
          PASSTHROUGH = 360 / 252 - 1

          rate_rows = []
          with open('/tmp/rate-borrow.csv', newline='') as f:
              for r in csv.DictReader(f):
                  rate_rows.append((r['date'], float(r['value'])))
          rate_rows.sort()
          rate_dates = [r[0] for r in rate_rows]
          rate_values = [r[1] for r in rate_rows]

          def rate_on_or_before(d):
              i = bisect.bisect_right(rate_dates, d) - 1
              if i < 0:
                  raise RuntimeError(f'No borrowing rate on or before {d}')
              return rate_values[i]

          rows = []
          with open('/tmp/index-sp.csv', newline='') as f:
              for r in csv.DictReader(f):
                  d = r['date']
                  if START <= d <= END:
                      rows.append({
                          'date': d,
                          'total_return': float(r['adj_close']),
                          'price_only': float(r['close']),
                          'borrow_annual': rate_on_or_before(d),
                      })

          def simulate(field, cfg):
              L = cfg['leverage']
              er_daily = cfg['expense_pct'] / 100 / 252
              values = [1.0]
              for i in range(1, len(rows)):
                  idx_ret = rows[i][field] / rows[i-1][field] - 1
                  annual = rows[i]['borrow_annual']
                  fitted = min(annual, 0.06)
                  extra = max(0.0, annual - 0.06)
                  annual_spread = cfg['rate_sensitivity'] * fitted + cfg['base_spread'] + PASSTHROUGH * extra
                  daily_ret = L * idx_ret - er_daily - (L - 1) * ((annual + annual_spread) / 360)
                  values.append(max(0.0, values[-1] * (1 + daily_ret)))
              return values

          def metrics(values, start, end):
              idx = [i for i,r in enumerate(rows) if start <= r['date'] <= end]
              a, b = idx[0], idx[-1]
              base = values[a]
              rel = [v/base for v in values[a:b+1]]
              final = rel[-1]
              days = (date.fromisoformat(rows[b]['date']) - date.fromisoformat(rows[a]['date'])).days
              cagr = final ** (365.25/days) - 1
              peak = rel[0]
              peak_date = rows[a]['date']
              mdd = 0.0
              dd_start = peak_date
              dd_end = peak_date
              for j,v in enumerate(rel):
                  if v > peak:
                      peak = v
                      peak_date = rows[a+j]['date']
                  dd = v/peak - 1
                  if dd < mdd:
                      mdd = dd
                      dd_start = peak_date
                      dd_end = rows[a+j]['date']
              return {
                  'start': rows[a]['date'], 'end': rows[b]['date'],
                  'finalMultiple': final, 'cagrPct': cagr*100,
                  'maxDrawdownPct': -mdd*100,
                  'maxDrawdownDates': {'start': dd_start, 'end': dd_end},
              }

          output = {'inputRows': len(rows), 'start': rows[0]['date'], 'end': rows[-1]['date'], 'results': {}}
          for name,cfg in CONFIGS.items():
              output['results'][name] = {}
              for field in ('total_return','price_only'):
                  values = simulate(field,cfg)
                  output['results'][name][field] = {
                      label: metrics(values,*period) for label,period in PERIODS.items()
                  }

          with open('/tmp/spx-price-only-sensitivity.json','w') as f:
              json.dump(output,f,indent=2)
          print(json.dumps(output,indent=2))
          PY

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: spx-price-only-sensitivity
          path: /tmp/spx-price-only-sensitivity.json
          retention-days: 1
