name: Isolated SPMO point-in-time source audit
on:
  push:
    branches: [research/spmo-pit-1985]
    paths: [.github/workflows/research-spmo-pit-source.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Retrieve public research inputs and source metadata
        shell: bash
        run: |
          mkdir -p out
          cat > /tmp/audit.py <<'PY'
          import concurrent.futures, hashlib, json, pathlib, urllib.request
          root = pathlib.Path('out')
          files = {
            'membership_thesis.csv': 'https://raw.githubusercontent.com/Developer-KI/BSc-Thesis/9846f3db95bc7a5325902256a6cd1f4159815e8e/data/constiuents.csv',
            'membership_2024.csv': 'https://raw.githubusercontent.com/KaiH0320/QT_4/f7051158e3118c4f7042cd64bd8687e10a79037c/data_soruces/DataQT2026/SP500_Index_Constitutes2024.csv',
            'membership_nlp.csv': 'https://raw.githubusercontent.com/Choooooc/NLP/0fae560d457d9d1cd2893bb84c855b9430b8235b/Assign1/sp500_constituents.csv',
            'methodology.pdf': 'https://www.spglobal.com/spdji/en/documents/methodologies/methodology-sp-momentum-indices.pdf',
            'sp500_daily.csv': 'https://raw.githubusercontent.com/joseparreiras/finc585/main/data/SP500_daily.csv',
            'hf_crsp_datasets.json': 'https://huggingface.co/api/datasets?search=crsp&limit=100',
          }
          repos = [
            'Choooooc/NLP','KaiH0320/QT_4','yihengli/AFP_Forecast_Alpha_Using_ML',
            'dlab-projects/marketflow','matthewa18/ML-Based-Equity-Return-Classifier',
            'matthewadrian9-tech/Analog-Engine','Developer-KI/BSc-Thesis',
            'vonHacht/Edgar','wenqian66/replicate',
          ]
          for repo in repos:
            stem=repo.replace('/','__')
            files[stem+'__tree.json']='https://api.github.com/repos/'+repo+'/git/trees/HEAD?recursive=1'
            files[stem+'__readme.json']='https://api.github.com/repos/'+repo+'/readme'
          def get(item):
            name,url=item
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'SPMO-PIT-research-source-audit','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=40) as r:
                b=r.read(64*1024*1024+1)
                if len(b)>64*1024*1024: raise ValueError('source exceeds audit size cap')
                (root/name).write_bytes(b)
                return {'file':name,'url':url,'status':r.status,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
            except Exception as e: return {'file':name,'url':url,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:
            results=list(ex.map(get,files.items()))
          (root/'manifest.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          PY
          python /tmp/audit.py
      - name: Archive source audit
        uses: actions/upload-artifact@v4
        with:
          name: spmo-pit-source-audit
          path: out/
          retention-days: 7
