name: QLD TQQQ monitor tests

on:
  push:
    branches:
      - main
    paths:
      - "qld_tqqq_signal_monitor/**"
      - ".github/workflows/qld-tqqq-signal.yml"
      - ".github/workflows/qld-tqqq-tests.yml"
  pull_request:
    paths:
      - "qld_tqqq_signal_monitor/**"
      - ".github/workflows/qld-tqqq-signal.yml"
      - ".github/workflows/qld-tqqq-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: qld_tqqq_signal_monitor/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r qld_tqqq_signal_monitor/requirements.txt

      - name: Run monthly-strategy regression tests
        run: python -m pytest qld_tqqq_signal_monitor/tests
