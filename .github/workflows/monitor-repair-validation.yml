name: Isolated monitor provider diagnosis
on:
  push:
    branches: [fix/monthly-data-recovery-20260904]
    paths: [.github/workflows/monitor-repair-validation.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test only the two original data providers
        run: |
          mkdir -p provider_diagnosis
          python - <<'PY'
          import concurrent.futures, json, pathlib, time, urllib.request
          root=pathlib.Path('provider_diagnosis')
          fred='https://fred.stlouisfed.org/graph/fredgraph.csv?id=NASDAQ100'
          jobs=[
            ('fred_original',fred,{'User-Agent':'qld-tqqq-signal-monitor/1.0 (notification-only quantitative model; GitHub issue #1)'}),
            ('fred_nocache',fred,{'User-Agent':'Mozilla/5.0 monthly-signal-monitor/2.0','Cache-Control':'no-cache','Pragma':'no-cache'}),
            ('ndx_same_index','https://query1.finance.yahoo.com/v8/finance/chart/%5ENDX?range=5y&interval=1d',{'User-Agent':'Mozilla/5.0 monthly-signal-monitor/2.0'})
          ]
          def probe(job):
            name,url,headers=job; start=time.monotonic()
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as r:
                body=r.read(); code=r.status
              (root/(name+'.txt')).write_bytes(body)
              return {'name':name,'url':url,'status':code,'bytes':len(body),'seconds':time.monotonic()-start}
            except Exception as e:
              return {'name':name,'url':url,'error':str(e),'seconds':time.monotonic()-start}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
            results=list(pool.map(probe,jobs))
          (root/'results.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-provider-diagnosis
          path: provider_diagnosis/
          retention-days: 7
