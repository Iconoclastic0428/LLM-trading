name: Isolated monitor repair validation
# Same-runner comparison verified system Python for FRED byte transport.
on:
  push:
    branches: [fix/monthly-data-recovery-20260904]
    paths: [.github/workflows/monitor-repair-validation.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -r qld_tqqq_signal_monitor/requirements.txt
      - run: python -m pytest qld_tqqq_signal_monitor/tests -q --junitxml=test-results.xml
      - name: Verify frozen strategy source
        run: test "$(git hash-object qld_tqqq_signal_monitor/monitor.py)" = "6288f18f8a65badc9d8a9738ff030452d5760e86"
      - name: Validate live closing data without posting
        timeout-minutes: 10
        run: python qld_tqqq_signal_monitor/exact_monitor.py
      - name: Audit past month-end without posting
        timeout-minutes: 5
        run: python qld_tqqq_signal_monitor/exact_monitor.py --report-date 2026-08-31 --output-dir replay_output
      - name: Verify live freshness and historical isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('signal_output/status.json').read_text())
          assert s['status'] == 'ok'
          assert all(x['latest_date'] == s['expected_session'] for x in s['sources'].values())
          r = json.loads(Path('replay_output/signal.json').read_text())
          assert not r['publish_notification'] and r['mode'] == 'replay'
          assert all(x['instruction'] == 'historical_only' for x in r['decisions'])
          print(json.dumps(s, ensure_ascii=False, indent=2))
          PY
      - name: Archive scoped source and audit
        if: always()
        run: tar -czf monitor-source.tgz qld_tqqq_signal_monitor .github/workflows/qld-tqqq-signal.yml .github/workflows/qld-tqqq-tests.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitor-repair-validation
          path: |
            monitor-source.tgz
            test-results.xml
            signal_output/
            replay_output/
          retention-days: 7
