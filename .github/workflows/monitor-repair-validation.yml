name: Isolated same-runner data transport diagnosis
on:
  push:
    branches: [fix/monthly-data-recovery-20260904]
    paths: [.github/workflows/monitor-repair-validation.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Same runner FRED transport comparison
        run: |
          mkdir -p transport_diagnosis
          cat > /tmp/fred_probe.py <<'PY'
          import json, pathlib, ssl, sys, time, urllib.request
          tag=sys.argv[1]; start=time.monotonic()
          url='https://fred.stlouisfed.org/graph/fredgraph.csv?id=NASDAQ100'
          headers={'User-Agent':'Mozilla/5.0 monthly-signal-monitor/2.0','Cache-Control':'no-cache','Pragma':'no-cache'}
          result={'tag':tag,'python':sys.version,'ssl':ssl.OPENSSL_VERSION}
          try:
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=18) as r:
              body=r.read();result.update(status=r.status,bytes=len(body))
            pathlib.Path('transport_diagnosis',tag+'.csv').write_bytes(body)
          except Exception as e:result['error']=str(e)
          result['seconds']=time.monotonic()-start
          pathlib.Path('transport_diagnosis',tag+'.json').write_text(json.dumps(result,indent=2))
          PY
          python /tmp/fred_probe.py hosted &
          /usr/bin/python3 /tmp/fred_probe.py system &
          curl --fail --silent --show-error --location --connect-timeout 8 --max-time 18 --user-agent 'Mozilla/5.0 monthly-signal-monitor/2.0' 'https://fred.stlouisfed.org/graph/fredgraph.csv?id=NASDAQ100' -o transport_diagnosis/curl.csv 2>transport_diagnosis/curl-error.txt &
          wait
          cat transport_diagnosis/*.json
          wc -c transport_diagnosis/*
      - uses: actions/upload-artifact@v4
        with:
          name: same-runner-transport-diagnosis
          path: transport_diagnosis/
          retention-days: 7
