name: Isolated historical equity price coverage audit
on:
  push:
    branches: [research/spmo-pit-1985]
    paths: [.github/workflows/research-spmo-pit-prices.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Retrieve historical samples and public price-file metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p out
          python - <<'PY'
          import concurrent.futures,csv,hashlib,io,json,os,pathlib,urllib.request,urllib.parse,zipfile
          root=pathlib.Path('out')
          base='https://raw.githubusercontent.com/'
          files={
           'ibm_crsp.csv':base+'yihengli/AFP_Forecast_Alpha_Using_ML/ea3cabbfe13cf0b9577e8984317bba05438206a8/stock/IBM.csv',
           'allsp_compustat.csv':base+'yihengli/AFP_Forecast_Alpha_Using_ML/ea3cabbfe13cf0b9577e8984317bba05438206a8/list_snp500.csv',
           'nlp_stock_data.zip':base+'Choooooc/NLP/0fae560d457d9d1cd2893bb84c855b9430b8235b/Assign1/stock_data.csv.zip',
           'nlp_names.csv':base+'Choooooc/NLP/0fae560d457d9d1cd2893bb84c855b9430b8235b/Assign1/sp500_w_addl_id.csv',
           'nlp_query.ipynb':base+'Choooooc/NLP/0fae560d457d9d1cd2893bb84c855b9430b8235b/Assign1/Query.ipynb',
          }
          def get(item):
            name,url=item
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'SPMO-PIT-source-audit'}),timeout=40) as r:b=r.read()
              (root/name).write_bytes(b)
              d={'file':name,'url':url,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
              if name.endswith('.csv'):
                lines=b.decode('utf-8-sig').splitlines();d['first_lines']=lines[:3];d['last_line']=lines[-1];d['line_count']=len(lines)
              if name.endswith('.zip'):
                with zipfile.ZipFile(io.BytesIO(b)) as z:
                  d['files']=z.namelist()
                  for n in z.namelist():
                    if n.endswith('.csv'):
                      lines=z.read(n).decode('utf-8-sig').splitlines();d['first_lines']=lines[:3];d['last_line']=lines[-1];d['line_count']=len(lines)
              return d
            except Exception as e:return {'file':name,'url':url,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:out=list(ex.map(get,files.items()))
          for query in ['PERMNO RETX extension:csv -repo:yihengli/AFP_Forecast_Alpha_Using_ML','PERMNO NAMEDT NAMEENDT extension:csv','CRSP extension:parquet']:
            url='https://api.github.com/search/code?'+urllib.parse.urlencode({'q':query,'per_page':100})
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'SPMO-PIT-source-audit','Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN']})
              with urllib.request.urlopen(req,timeout=40) as r:j=json.load(r)
              out.append({'query':query,'total_count':j.get('total_count'),'items':[{'repo':a['repository']['full_name'],'path':a['path'],'sha':a['sha']} for a in j.get('items',[])]})
            except Exception as e:out.append({'query':query,'error':str(e)})
          (root/'manifest.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Archive price coverage audit
        uses: actions/upload-artifact@v4
        with:
          name: spmo-pit-price-audit
          path: out/
          retention-days: 7
