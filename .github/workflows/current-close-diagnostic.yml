name: Current close availability diagnostic
on:
  push:
    branches: [diagnostic/current-close-20261027]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Capture public current daily records only
        run: |
          python - <<'PY'
          import concurrent.futures,datetime,json,pathlib,urllib.request,hashlib
          p=pathlib.Path('current_close');p.mkdir()
          urls={
          'nasdaq_ndx':'https://api.nasdaq.com/api/quote/NDX/historical?assetclass=index&fromdate=2026-09-01&todate=2026-10-27&limit=100',
          'nasdaq_qqq':'https://api.nasdaq.com/api/quote/QQQ/historical?assetclass=etf&fromdate=2026-09-01&todate=2026-10-27&limit=100',
          'ndx_info':'https://api.nasdaq.com/api/quote/NDX/info?assetclass=index',
          'yahoo_ndx':'https://query1.finance.yahoo.com/v8/finance/chart/%5ENDX?range=3mo&interval=1d&includePrePost=false',
          'yahoo_qqq':'https://query1.finance.yahoo.com/v8/finance/chart/QQQ?range=3mo&interval=1d&includePrePost=false'}
          def get(pair):
           name,url=pair;r={'name':name,'url':url,'at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
           try:
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json','Origin':'https://www.nasdaq.com','Referer':'https://www.nasdaq.com/','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=20) as resp:b=resp.read(2000000);r['headers']=dict(resp.headers)
            (p/(name+'.json')).write_bytes(b);r['sha256']=hashlib.sha256(b).hexdigest()
           except Exception as e:r['error']=str(e)
           return r
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:rows=list(ex.map(get,urls.items()))
          (p/'manifest.json').write_text(json.dumps(rows,indent=2))
          print(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-close-${{ github.run_id }}
          path: current_close/
          retention-days: 30
