name: QQQ repair source snapshot
on:
  pull_request:
    paths: ['.github/workflows/qqq-repair-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preserve tested public source only
        uses: actions/upload-artifact@v4
        with:
          name: qqq-repair-source-${{ github.run_id }}
          include-hidden-files: true
          path: |
            qld_tqqq_signal_monitor/
            .github/workflows/
            AGENTS.md
          retention-days: 30
