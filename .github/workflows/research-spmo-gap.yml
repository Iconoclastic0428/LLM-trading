name: Isolated SPMO 2020 exceptional calendar data
on:
  push:
    branches: [research/spmo-top1-20260910]
    paths: [.github/workflows/research-spmo-gap.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve frozen March 2020 holdings
        run: |
          mkdir -p /tmp/spmo-exception
          python - <<'PY'
          import urllib.request,pathlib,json,hashlib
          p=pathlib.Path('/tmp/spmo-exception');urls={
          '20200331.csv':'https://raw.githubusercontent.com/riazarbi/sp500-scraper/88556c3b823d61377551bcbdd396c509854180d6/ishares/sp500/csv/20200331.csv',
          '20200330.csv':'https://raw.githubusercontent.com/riazarbi/sp500-scraper/88556c3b823d61377551bcbdd396c509854180d6/ishares/sp500/csv/20200330.csv',
          'announcement.pdf':'https://www.spglobal.com/spdji/en/documents/indexnews/announcements/20200331-1119561/1119561_spdjiconsulteffdatespostponedmarch2020rebalresults3.31.2020.pdf'}
          log=[]
          for name,url in urls.items():
              try:
                  with urllib.request.urlopen(url,timeout=30) as r:b=r.read()
                  (p/name).write_bytes(b);log.append({'name':name,'url':url,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'ok':True})
              except Exception as e:log.append({'name':name,'url':url,'error':str(e),'ok':False})
          (p/'manifest.json').write_text(json.dumps(log,indent=2));print(log)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: spmo-2020-exception
          path: /tmp/spmo-exception/
          retention-days: 7
