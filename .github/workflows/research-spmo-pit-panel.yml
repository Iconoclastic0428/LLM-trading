name: Isolated SPMO historical permanent-ID panel
on:
  push:
    branches: [research/spmo-pit-1985]
    paths: [.github/workflows/research-spmo-pit-panel.yml]
permissions:
  contents: read
jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Collect fixed-source daily records without ticker-based joins
        shell: bash
        run: |
          mkdir -p out/panel
          python - <<'PY'
          import concurrent.futures,csv,gzip,hashlib,io,json,pathlib,time,urllib.request
          repo='yihengli/AFP_Forecast_Alpha_Using_ML'
          sha='ea3cabbfe13cf0b9577e8984317bba05438206a8'
          root=pathlib.Path('out')
          headers={'User-Agent':'SPMO-permanent-security-ID-reconstruction'}
          def request(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=40) as r:return r.read()
          tree=json.loads(request(f'https://api.github.com/repos/{repo}/git/trees/{sha}?recursive=1'))
          (root/'source-tree.json').write_text(json.dumps(tree))
          entries=[x for x in tree['tree'] if x['path'].startswith('stock/') and x['path'].endswith('.csv')]
          cols=['PERMNO','date','TICKER','COMNAM','NCUSIP','PERMCO','SHRCD','EXCHCD','PRC','RET','RETX','SHROUT','CFACPR','CFACSHR','OPENPRC','DLRET','DLRETX','DLSTCD','NWPERM']
          def process(x):
            url=f'https://raw.githubusercontent.com/{repo}/{sha}/'+x['path']
            err=None
            for attempt in range(3):
              try:
                b=request(url)
                actual=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
                if actual!=x['sha']: raise ValueError('Git blob digest differs')
                rows=list(csv.DictReader(io.StringIO(b.decode('utf-8-sig'))))
                if not rows or not set(cols[:2]).issubset(rows[0]): raise ValueError('unexpected schema')
                out=io.StringIO();writer=csv.DictWriter(out,fieldnames=cols);writer.writeheader()
                for r in rows:writer.writerow({c:r.get(c,'') for c in cols})
                fn=x['path'].split('/')[-1]+'.gz'
                with gzip.open(root/'panel'/fn,'wt',encoding='utf-8',newline='') as f:f.write(out.getvalue())
                dates=[r['date'] for r in rows]
                return {'path':x['path'],'url':url,'git_blob':actual,'raw_sha256':hashlib.sha256(b).hexdigest(),'rows':len(rows),'min_date':min(dates),'max_date':max(dates),'permnos':sorted(set(r['PERMNO'] for r in rows)),'status':'ok'}
              except Exception as e:err=str(e);time.sleep(attempt+1)
            return {'path':x['path'],'url':url,'status':'error','error':err}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
            results=[]
            for r in ex.map(process,entries):
              results.append(r)
              if len(results)%100==0:print('Fetched',len(results),'of',len(entries),flush=True)
          (root/'manifest.json').write_text(json.dumps({'source':repo,'commit':sha,'entries':results},indent=2))
          print('Summary',len(results),sum(x['status']=='ok' for x in results))
          PY
      - name: Archive historical panel and audit
        uses: actions/upload-artifact@v4
        with:
          name: spmo-permanent-id-panel
          path: out/
          retention-days: 7
          compression-level: 0
