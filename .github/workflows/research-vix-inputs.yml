name: Isolated VIX overlay data download
on:
  push:
    branches: [research/vix-overlay-20260914]
    paths: [.github/workflows/research-vix-inputs.yml]
permissions:
  contents: read
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download official supplementary histories
        shell: bash
        run: |
          mkdir -p out
          /usr/bin/python3 - <<'PY'
          import pathlib,urllib.request,urllib.parse,concurrent.futures,json,hashlib,datetime,re
          root=pathlib.Path('out')
          urls={
            'VIX_FRED.csv':'https://fred.stlouisfed.org/graph/fredgraph.csv?id=VIXCLS&cosd=1990-01-01&coed=2026-09-11',
            'VXO_FRED.csv':'https://fred.stlouisfed.org/graph/fredgraph.csv?id=VXOCLS&cosd=1986-01-01&coed=1990-01-01',
            'VIX_FRED_table.html':'https://fred.stlouisfed.org/data/VIXCLS',
            'VXO_FRED_table.html':'https://fred.stlouisfed.org/data/VXOCLS',
            'VXO_History.csv':'https://cdn.cboe.com/api/global/us_indices/daily_prices/VXO_History.csv',
            'CBOE_history_page.html':'https://www.cboe.com/tradable-products/vix/vix-historical-data',
          }
          def get(item):
            name,url=item
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=35) as r:b=r.read()
              (root/name).write_bytes(b)
              return {'file':name,'url':url,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'downloaded_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
            except Exception as e:return {'file':name,'url':url,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:res=list(ex.map(get,urls.items()))
          page=root/'CBOE_history_page.html'
          if page.exists():
            links=re.findall(r'href=[\"\x27]([^\"\x27]+)',page.read_text())
            for i,u in enumerate(links):
              if 'vxo' in u.lower() or 'vixarchive' in u.lower():
                res.append(get(('archive_'+str(i)+'_'+u.split('/')[-1],urllib.parse.urljoin(urls['CBOE_history_page.html'],u))))
          (root/'supplement_manifest.json').write_text(json.dumps(res,indent=2));print(json.dumps(res,indent=2))
          PY
      - name: Archive source data
        uses: actions/upload-artifact@v4
        with:
          name: vix-overlay-official-supplement
          path: out/
          retention-days: 7
