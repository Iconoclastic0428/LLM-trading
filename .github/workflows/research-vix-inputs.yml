name: Isolated VIX overlay data download
on:
  push:
    branches: [research/vix-overlay-20260914]
    paths: [.github/workflows/research-vix-inputs.yml]
permissions:
  contents: read
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch official raw histories without changing production
        shell: bash
        run: |
          mkdir -p out
          python - <<'PY'
          import pathlib,urllib.request,concurrent.futures,json,hashlib,datetime
          root=pathlib.Path('out')
          urls={
            'VIX_History.csv':'https://cdn.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv',
            'vxoarchive.csv':'https://cdn.cboe.com/resources/indices/documents/vxoarchive.csv',
            'vixarchive.csv':'https://cdn.cboe.com/resources/indices/documents/vixarchive.csv',
            'VIX_FRED.csv':'https://fred.stlouisfed.org/graph/fredgraph.csv?id=VIXCLS',
            'VXO_FRED.csv':'https://fred.stlouisfed.org/graph/fredgraph.csv?id=VXOCLS',
          }
          def get(item):
            name,url=item
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=45) as r:b=r.read()
              (root/name).write_bytes(b)
              return {'file':name,'url':url,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'downloaded_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
            except Exception as e:return {'file':name,'url':url,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:res=list(ex.map(get,urls.items()))
          (root/'manifest.json').write_text(json.dumps(res,indent=2))
          print(json.dumps(res,indent=2))
          assert (root/'VIX_History.csv').exists()
          PY
      - name: Archive source data
        uses: actions/upload-artifact@v4
        with:
          name: vix-overlay-official-inputs
          path: out/
          retention-days: 7
