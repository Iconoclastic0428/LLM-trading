name: Isolated SPMO ranking reconstruction inputs
on:
  push:
    branches: [research/spmo-top1-20260910]
    paths: [.github/workflows/research-spmo-reconstruct.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch archived IVV reference-date holdings and raw prices
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p /tmp/spmo-reconstruct
          cat > /tmp/spmo-reconstruct/download.py <<'PY'
          import calendar, concurrent.futures, csv, datetime as dt, gzip, hashlib, io, json, os, pathlib, time, urllib.request, urllib.parse
          ROOT=pathlib.Path('/tmp/spmo-reconstruct'); (ROOT/'holdings').mkdir(exist_ok=True); (ROOT/'prices').mkdir(exist_ok=True)
          UA='quantitative-research/1.0 contact github.com/Iconoclastic0428'
          def get(url, api=False, tries=3):
              h={'User-Agent':UA}
              if api: h['Authorization']='Bearer '+os.environ['GH_TOKEN']
              for t in range(tries):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers=h), timeout=35) as f: return f.read()
                  except Exception:
                      if t==tries-1: raise
                      time.sleep(1+t*2)
          repo='riazarbi/sp500-scraper'
          head=json.loads(get('https://api.github.com/repos/'+repo+'/commits/main',True))['sha']
          entries=json.loads(get('https://api.github.com/repos/'+repo+'/git/trees/'+head+'?recursive=1',True))
          (ROOT/'source-tree.json').write_text(json.dumps(entries))
          paths={x['path'].split('/')[-1][:8]:x['path'] for x in entries['tree'] if x['path'].startswith('ishares/sp500/csv/') and x['path'].endswith('.csv')}
          dates=sorted(paths)
          selected=[]; coverage=[]
          for y in range(2007,2027):
              for m in (2,8):
                  ref=dt.date(y,m,calendar.monthrange(y,m)[1])
                  while ref.weekday()>4: ref-=dt.timedelta(days=1)
                  if ref>dt.date(2026,9,10): continue
                  candidates=[d for d in dates if d<=ref.strftime('%Y%m%d') and d[:6]==ref.strftime('%Y%m')]
                  d=max(candidates) if candidates else None
                  cov={'expected_reference':str(ref),'archive_date':d,'file':paths.get(d),'lag_days':(ref-dt.datetime.strptime(d,'%Y%m%d').date()).days if d else None}
                  coverage.append(cov)
                  if d is not None and cov['lag_days']<=5: selected.append((d,paths[d]))
          def fetch_h(item):
              d,path=item; raw=get('https://raw.githubusercontent.com/'+repo+'/'+head+'/'+urllib.parse.quote(path)); (ROOT/'holdings'/ (d+'.csv')).write_bytes(raw)
              return {'date':d,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool: manifests=list(pool.map(fetch_h,selected))
          (ROOT/'coverage.json').write_text(json.dumps(coverage,indent=2))
          (ROOT/'manifest.json').write_text(json.dumps({'retrieved_at':dt.datetime.now(dt.timezone.utc).isoformat(),'source_commit':head,'source_repo':repo,'tree_truncated':entries.get('truncated'),'holdings':manifests},indent=2))
          tickers=set(); identities=[]
          for d,_ in selected:
              rows=list(csv.DictReader((ROOT/'holdings'/(d+'.csv')).read_text().splitlines()))
              for r in rows:
                  if r.get('asset_class') not in ('Equity','equity'): continue
                  s=r.get('symbol','').strip(); tickers.add(s); identities.append({'reference':d,**r})
          (ROOT/'identities.json').write_text(json.dumps(identities))
          # Preserve every historical member; failures are explicit, never replaced by current members.
          aliases={'BRKB':'BRK-B','BRK.B':'BRK-B','BFB':'BF-B','BF.B':'BF-B','FB':'META','ANTM':'ELV','HRS':'LHX','VIAB':'VIAB','RE':'EG','PKI':'RVTY','FBHS':'FBIN','NLSN':'NLSN','DPS':'DPS','PCLN':'BKNG','SNI':'SNI','UTX':'UTX','TWX':'TWX','WAG':'WAG','MON':'MON','CELG':'CELG','SIVB':'SIVB','FRC':'FRC'}
          def symbol(s): return aliases.get(s,s.replace('.','-'))
          all_symbols=sorted({symbol(s) for s in tickers if s not in ('-','') }|{'SPY','SPMO','QQQ'})
          start=int(dt.datetime(2005,1,1,tzinfo=dt.timezone.utc).timestamp()); end=int(dt.datetime(2026,9,11,tzinfo=dt.timezone.utc).timestamp())
          def fetch_p(s):
              err=[]
              query=urllib.parse.urlencode({'period1':start,'period2':end,'interval':'1d','events':'div,splits','includeAdjustedClose':'true'})
              for host in ('query1','query2'):
                  url='https://'+host+'.finance.yahoo.com/v8/finance/chart/'+urllib.parse.quote(s)+'?'+query
                  try:
                      raw=get(url,tries=1); p=json.loads(raw); result=p['chart']['result'][0]
                      if not result.get('timestamp'): raise ValueError('empty timestamps')
                      with gzip.open(ROOT/'prices'/(s+'.json.gz'),'wb') as f: f.write(raw)
                      return {'symbol':s,'ok':True,'n':len(result['timestamp']),'url':url,'sha256':hashlib.sha256(raw).hexdigest()}
                  except Exception as e: err.append(str(e))
                  time.sleep(0.2)
              return {'symbol':s,'ok':False,'errors':err}
          print('HEAD',head,'holding snapshots',len(selected),'symbols',len(all_symbols),flush=True)
          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              for i,r in enumerate(pool.map(fetch_p,all_symbols)):
                  results.append(r)
                  if i%50==0: print('price progress',i,'ok',sum(x['ok'] for x in results),flush=True)
          (ROOT/'price-manifest.json').write_text(json.dumps(results,indent=2)); (ROOT/'aliases.json').write_text(json.dumps(aliases,indent=2))
          print('DONE',len(results),'ok',sum(x['ok'] for x in results),'failed',[r['symbol'] for r in results if not r['ok']],flush=True)
          PY
          python /tmp/spmo-reconstruct/download.py
      - name: Archive research data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spmo-reconstruction-inputs
          path: /tmp/spmo-reconstruct/
          retention-days: 7
