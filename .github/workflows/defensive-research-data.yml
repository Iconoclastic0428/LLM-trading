name: Defensive allocation research data only
on:
  pull_request:
    paths: ['.github/workflows/defensive-research-data.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Retrieve public MO PM histories and dividend records; no signals or orders
        run: |
          python - <<'PY'
          import concurrent.futures,datetime,hashlib,json,pathlib,urllib.request,urllib.parse
          out=pathlib.Path('mo_pm_sources');out.mkdir(exist_ok=True)
          end=int(datetime.datetime(2026,10,7,tzinfo=datetime.timezone.utc).timestamp())
          sources=[]
          for s in ['MO','PM','QQQ']:
           for h in ['query1','query2']:
            u='https://'+h+'.finance.yahoo.com/v8/finance/chart/'+s+'?'+urllib.parse.urlencode({'period1':0,'period2':end,'interval':'1d','events':'div,splits','includePrePost':'false'})
            sources.append((s+'_'+h+'.json',u))
          sources += [('mo_official_dividends.html','https://investor.altria.com/stock-performance/dividend-information/default.aspx'),('pm_official_dividends.html','https://www.pmi.com/investor-relations/stock-and-dividend-information'),('altria_spinoff_faq.html','https://investor.altria.com/frequently-asked-questions/default.aspx')]
          def get(item):
           name,url=item;rec={'name':name,'url':url,'at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
           try:
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'*/*','Cache-Control':'no-cache'}),timeout=35) as r:
             b=r.read(15000000);rec.update(http_status=r.status,content_type=r.headers.get('Content-Type'))
            if name.endswith('.json'):
             j=json.loads(b);obj=j['chart']['result'][0];assert obj['meta']['symbol']==name.split('_')[0]
             rec.update(rows=len(obj['timestamp']),dividends=len(obj.get('events',{}).get('dividends',{})))
            (out/name).write_bytes(b);rec.update(status='downloaded',bytes=len(b),sha256=hashlib.sha256(b).hexdigest())
           except Exception as e:rec.update(status='error',error=str(e))
           print(json.dumps(rec));return rec
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:records=list(pool.map(get,sources))
          (out/'manifest.json').write_text(json.dumps(records,indent=2))
          assert all(any(r['name'].startswith(s+'_query') and r['status']=='downloaded' for r in records) for s in ['MO','PM','QQQ'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mo-pm-sources-${{ github.run_id }}
          path: mo_pm_sources/
          retention-days: 30
