name: Defensive allocation research data only
on:
  pull_request:
    paths: ['.github/workflows/defensive-research-data.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public KMLM investor-deck metadata; never submit registration
        run: |
          python - <<'PY'
          import datetime, hashlib, json, pathlib, urllib.request
          out=pathlib.Path('index_sources');out.mkdir(exist_ok=True);records=[]
          def get(url,name):
              rec={'url':url,'file':name};records.append(rec)
              try:
                  r=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,*/*','doc-referer':'https://kraneshares.com/kmlm-managed-futures-faq/'}),timeout=35)
                  data=r.read(35000000);(out/name).write_bytes(data);rec.update(status='downloaded',bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
                  return data
              except Exception as exc:rec.update(status='error',error=str(exc));return None
          raw=get('https://p2api.celero.io/api/shorten/1435f652/?ks_product=kmlm&p_num=18&viewer=true','shorten.json')
          if raw:
              j=json.loads(raw);data=j.get('data',j);restricted=any(data.get(k) is True for k in ['restrict_access','require_login','password_protected','requires_authentication'])
              if restricted:records.append({'status':'stopped','reason':'public response marks access restricted; no login or registration attempted'})
              elif data.get('content_uuid'):
                  get('https://p2api.celero.io/api/content/'+str(data['content_uuid'])+'/','content.json')
          (out/'manifest.json').write_text(json.dumps({'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'purpose':'public historical index source discovery only','records':records},indent=2));print((out/'manifest.json').read_text())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: index-sources-${{ github.run_id }}
          path: index_sources/
          retention-days: 30
