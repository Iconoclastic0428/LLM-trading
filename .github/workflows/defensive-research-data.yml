name: Defensive allocation research data only
on:
  pull_request:
    paths: ['.github/workflows/defensive-research-data.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Retrieve current public Treasury yield observations
        run: |
          python - <<'PY'
          import concurrent.futures,datetime,hashlib,json,pathlib,urllib.request,urllib.parse
          out=pathlib.Path('bill_sources');out.mkdir(exist_ok=True)
          sources=[
           ('treasury.html','https://home.treasury.gov/resource-center-data-chart-center/interest-rates/TextView?type=daily_treasury_bill_rates&field_tdr_date_value=2026'),
           ('treasury.xml','https://home.treasury.gov/resource-center-data-chart-center/interest-rates/pages/xml?data=daily_treasury_bill_rates&field_tdr_date_value=2026&page=0'),
           ('fred_bill.txt','https://fred.stlouisfed.org/data/DTB3.txt'),
           ('fred_bill_alternative.csv','https://fred.stlouisfed.org/graph/fredgraph.csv?cosd=2026-08-01&coed=2026-10-07&id=DTB3'),
           ('IRX.json','https://query1.finance.yahoo.com/v8/finance/chart/%5EIRX?'+urllib.parse.urlencode({'period1':1777593600,'period2':int(datetime.datetime.now(datetime.timezone.utc).timestamp()),'interval':'1d','includePrePost':'false'}))]
          def get(item):
           name,url=item;rec={'name':name,'url':url,'at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
           try:
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'}),timeout=40) as r:
             b=r.read(6000000);rec.update(http_status=r.status,content_type=r.headers.get('Content-Type'))
            (out/name).write_bytes(b);rec.update(status='downloaded',bytes=len(b),sha256=hashlib.sha256(b).hexdigest())
           except Exception as e:rec.update(status='error',error=str(e))
           print(json.dumps(rec));return rec
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:records=list(pool.map(get,sources))
          (out/'manifest.json').write_text(json.dumps(records,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bill-sources-${{ github.run_id }}
          path: bill_sources/
          retention-days: 30
