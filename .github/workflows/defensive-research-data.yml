name: Defensive allocation research data only
on:
  pull_request:
    paths: ['.github/workflows/defensive-research-data.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download public predecessor tables and gold observations only
        run: |
          python - <<'PY'
          import concurrent.futures, datetime, hashlib, json, pathlib, urllib.request
          out=pathlib.Path('long_history_sources');out.mkdir(exist_ok=True)
          links=[('kmlm_pitchbook_20260630.pdf','https://media.celero.io/users/6627/content/fcde4208c44d492e96ee9fff5dd9ef9a/original_file.pdf'),('gold_spot_stooq.csv','https://stooq.com/q/d/l/?s=xauusd&i=d&d1=19850101&d2=20041231'),('gold_fred_table.txt','https://fred.stlouisfed.org/data/GOLDPMGBD228NLBM.txt')]
          def fetch(item):
              name,url=item;rec={'url':url,'file':name}
              try:
                  r=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'}),timeout=40);data=r.read(35000000);(out/name).write_bytes(data)
                  rec.update(status='downloaded',bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
              except Exception as exc:rec.update(status='error',error=str(exc))
              return rec
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:recs=list(pool.map(fetch,links))
          manifest={'purpose':'read-only predecessor data; issuer viewer explicitly EVERYONE_ALLOWED; no registration submitted','at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'records':recs};(out/'manifest.json').write_text(json.dumps(manifest,indent=2));print(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-history-sources-${{ github.run_id }}
          path: long_history_sources/
          retention-days: 30
