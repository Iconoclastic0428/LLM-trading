name: Defensive allocation research data only
on:
  pull_request:
    paths: ['.github/workflows/defensive-research-data.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve public RSST and equity total-return data; no signals or orders
        run: |
          python - <<'PY'
          import concurrent.futures,datetime,hashlib,json,pathlib,urllib.request,urllib.parse
          out=pathlib.Path('rsst_sources');out.mkdir(exist_ok=True)
          end=int(datetime.datetime(2026,10,1,tzinfo=datetime.timezone.utc).timestamp())
          sources=[]
          for s in ['RSST','VFINX','SPY','^SP500TR','TQQQ','IALT','BDMIX']:
           for h in ['query1','query2']:
            url='https://'+h+'.finance.yahoo.com/v8/finance/chart/'+urllib.parse.quote(s,safe='')+'?'+urllib.parse.urlencode({'period1':0,'period2':end,'interval':'1d','events':'div,splits,capitalGains','includePrePost':'false'})
            sources.append((s.replace('^','')+'_'+h+'.json',url))
          sources += [('rsst_official.html','https://www.returnstackedetfs.com/rsst-return-stacked-us-stocks-managed-futures/'),('rsst_annual_2025.html','https://www.sec.gov/Archives/edgar/data/1924868/000199937125004015/return-ncsr_013125.htm'),('rsst_annual_2026.html','https://www.sec.gov/Archives/edgar/data/1924868/000199937126008023/returnstacker-ncsr_013126.htm')]
          def get(item):
           name,url=item;rec={'name':name,'url':url,'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
           try:
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'*/*','Cache-Control':'no-cache'}),timeout=35) as r:
             b=r.read(18000000);rec.update(http_status=r.status,content_type=r.headers.get('Content-Type'))
            if name.endswith('.json'):
             obj=json.loads(b)['chart']['result'][0]
             rec.update(symbol=obj['meta']['symbol'],rows=len(obj['timestamp']),dividends=len(obj.get('events',{}).get('dividends',{})))
            (out/name).write_bytes(b);rec.update(status='downloaded',bytes=len(b),sha256=hashlib.sha256(b).hexdigest())
           except Exception as e:rec.update(status='error',error=str(e))
           print(json.dumps(rec));return rec
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:records=list(pool.map(get,sources))
          (out/'manifest.json').write_text(json.dumps(records,indent=2))
          assert all(any(r['name'].startswith(s+'_query') and r['status']=='downloaded' for r in records) for s in ['RSST','VFINX','SPY','TQQQ','IALT'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rsst-sources-${{ github.run_id }}
          path: rsst_sources/
          retention-days: 30
