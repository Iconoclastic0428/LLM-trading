name: Defensive allocation research data only
on:
  pull_request:
    paths: ['.github/workflows/defensive-research-data.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Retrieve public pitchbook using the viewer's host substitution
        run: |
          python - <<'PY'
          import datetime,hashlib,json,pathlib,urllib.request
          out=pathlib.Path('index_pdf');out.mkdir(exist_ok=True)
          # Public viewer module 63962 replaces media.celero.io with its current
          # hostname. This is the documented public download, not authentication.
          url='https://engage.kraneshares.com/users/6627/content/fcde4208c44d492e96ee9fff5dd9ef9a/original_file.pdf'
          record={'url':url,'at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          try:
              r=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/pdf,*/*'}),timeout=40);b=r.read(35000000)
              assert b.startswith(b'%PDF'), 'Response is not a PDF'
              (out/'kmlm_pitchbook_20260630.pdf').write_bytes(b);record.update(status='downloaded',bytes=len(b),sha256=hashlib.sha256(b).hexdigest())
          except Exception as e:record.update(status='error',error=str(e))
          (out/'manifest.json').write_text(json.dumps(record,indent=2));print(json.dumps(record))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: index-pdf-${{ github.run_id }}
          path: index_pdf/
          retention-days: 30
