name: Defensive allocation research data only
on:
  pull_request:
    paths: ['.github/workflows/defensive-research-data.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Retrieve public BTAL source documents without generating signals
        run: |
          python - <<'PY'
          import concurrent.futures,datetime,hashlib,json,pathlib,urllib.request
          out=pathlib.Path('btal_sources');out.mkdir(exist_ok=True)
          sources=[
           ('agf_nav_dist.xlsx','https://www.agf.com/agf-files/us/xlsx/web-nav-dist.xlsx'),
           ('testfolio_help.html','https://testfol.io/help/'),
           ('sp_index.html','https://www.spglobal.com/spdji/en/indices/dividends-factors/dow-jones-us-thematic-market-neutral-low-beta-index/'),
           ('btal_prospectus.pdf','https://www.agf.com/agf-files/us/regulatory-documents/agf-trust-prospectus-us.pdf'),
           ('btal_annual.html','https://www.sec.gov/Archives/edgar/data/1479599/000199937126019517/agf-ncsr_063026.htm')]
          def get(item):
           name,url=item;rec={'name':name,'url':url,'at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
           try:
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'}),timeout=40) as r:
             b=r.read(18000000);rec.update(http_status=r.status,content_type=r.headers.get('Content-Type'))
            (out/name).write_bytes(b);rec.update(status='downloaded',bytes=len(b),sha256=hashlib.sha256(b).hexdigest())
           except Exception as e:rec.update(status='error',error=str(e))
           print(json.dumps(rec));return rec
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:records=list(pool.map(get,sources))
          (out/'manifest.json').write_text(json.dumps(records,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btal-sources-${{ github.run_id }}
          path: btal_sources/
          retention-days: 30
