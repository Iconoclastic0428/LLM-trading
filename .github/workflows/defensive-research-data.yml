name: Defensive allocation research data only
on:
  pull_request:
    paths: ['.github/workflows/defensive-research-data.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Archive official SG Trend index; no production signals or trades
        run: |
          python - <<'PY'
          import urllib.request, pathlib, hashlib, json, datetime
          out=pathlib.Path('sg_trend_sources');out.mkdir(exist_ok=True)
          url='https://wholesale.banking.societegenerale.com/fileadmin/indices_feeds/ti_screen/data/4.nav.csv'
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/csv,*/*'}),timeout=45) as r:
            b=r.read(5000000)
            metadata={'url':url,'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'content_type':r.headers.get('Content-Type')}
          assert len(b)>10000, 'Incomplete index response'
          (out/'sg_trend.csv').write_bytes(b)
          (out/'manifest.json').write_text(json.dumps(metadata,indent=2))
          print(metadata);print(b[:1200].decode('utf-8-sig'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sg-trend-source-${{ github.run_id }}
          path: sg_trend_sources/
          retention-days: 30
