name: Defensive allocation research data only
on:
  pull_request:
    paths: ['.github/workflows/defensive-research-data.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read public distribution and predecessor data; no production use
        run: |
          python - <<'PY'
          import concurrent.futures, datetime, hashlib, json, pathlib, urllib.request, urllib.parse
          out=pathlib.Path('distribution_audit');out.mkdir(exist_ok=True)
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/html,*/*','Cache-Control':'no-cache'}
          end=int(datetime.datetime(2026,8,29,tzinfo=datetime.timezone.utc).timestamp())
          urls=[]
          for sym in ['KMLM','DBMF','BTAL','SGOV']:
              urls.append((sym+'_all_events.json','https://query1.finance.yahoo.com/v8/finance/chart/'+sym+'?'+urllib.parse.urlencode({'period1':0,'period2':end,'interval':'1d','events':'div,splits,capitalGains','includePrePost':'false'})))
          urls.extend([
            ('imgp_distribution_history.html','https://www.imgp.com/us/resources/distributions-history/'),
            ('imgp_fund.html','https://www.imgp.com/us/fund/US53700T8273/'),
            ('deck_main1.js','https://engage.kraneshares.com/static/js/main-4f064d56.60e18699.js'),
            ('deck_main2.js','https://engage.kraneshares.com/static/js/main-88d3322f.8f3f1991.js'),
            ('gold_fred.csv','https://fred.stlouisfed.org/graph/fredgraph.csv?id=GOLDPMGBD228NLBM&cosd=1985-01-01&coed=2004-11-30'),
            ('sg_indices.html','https://wholesale.banking.societegenerale.com/en/prime-services-indices/')])
          def get(item):
              name,url=item
              record={'file':name,'url':url}
              try:
                  r=urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=40)
                  data=r.read(25000000);(out/name).write_bytes(data)
                  record.update(status='downloaded',bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),final_url=r.geturl())
              except Exception as exc:record.update(status='error',error=str(exc))
              return record
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:records=list(pool.map(get,urls))
          manifest={'at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'cutoff':'2026-08-28','purpose':'isolated historical distribution audit','records':records}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2));print(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distribution-audit-${{ github.run_id }}
          path: distribution_audit/
          retention-days: 30
