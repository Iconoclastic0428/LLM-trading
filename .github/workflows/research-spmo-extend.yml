name: Isolated SPMO legacy data extraction
on:
  push:
    branches: [research/spmo-top1-20260910]
    paths: [.github/workflows/research-spmo-extend.yml]
permissions:
  contents: read
  actions: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Select relevant securities from existing research artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p /tmp/spmo-legacy-small
          gh api repos/Iconoclastic0428/LLM-trading/actions/artifacts/10181055285/zip > /tmp/legacy.zip
          gh api repos/Iconoclastic0428/LLM-trading/actions/artifacts/10180917847/zip > /tmp/inputs.zip
          python - <<'PY'
          import zipfile,json,pathlib,shutil
          root=pathlib.Path('/tmp/spmo-legacy-small')
          a=zipfile.ZipFile('/tmp/inputs.zip'); ids=json.loads(a.read('identities.json'))
          norm=lambda s:s.upper().replace('-','').replace('.','').replace('/','').replace('*','')
          wanted={norm(x['symbol']) for x in ids}
          wanted.update(norm(s) for s in ['BRK-B','BF-B','META','RTX','BKNG','ELV','CPAY','GAP','GL','WELL','SPGI','TPR','JEF','FBIN','WTW','GEN','MON','UTX'])
          z=zipfile.ZipFile('/tmp/legacy.zip')
          for n in z.namelist():
              if n!='fnspid-csv.zip':(root/pathlib.Path(n).name).write_bytes(z.read(n))
          with z.open('fnspid-csv.zip') as f,open('/tmp/prices.zip','wb') as out:shutil.copyfileobj(f,out)
          src=zipfile.ZipFile('/tmp/prices.zip'); selected=[]
          with zipfile.ZipFile(root/'relevant-legacy-prices.zip','w',zipfile.ZIP_DEFLATED,compresslevel=7) as out:
              for name in src.namelist():
                  if norm(pathlib.PurePosixPath(name).stem) in wanted:
                      out.writestr(name,src.read(name));selected.append(name)
          (root/'selected-files.json').write_text(json.dumps(selected,indent=2))
          print('all legacy files',len(src.namelist()),'selected',len(selected),'size',(root/'relevant-legacy-prices.zip').stat().st_size)
          print((root/'manifest.json').read_text())
          print('MON/UTX', [x for x in src.namelist() if pathlib.Path(x).stem.upper() in ('MON','UTX','TWX','CELG','ATVI','NLSN','SIVB')])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: spmo-legacy-relevant
          path: /tmp/spmo-legacy-small/
          retention-days: 7
