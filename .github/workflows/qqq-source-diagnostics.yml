name: QQQ source readiness diagnostics
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/qqq-source-diagnostics.yml'
      - 'qld_tqqq_signal_monitor/qqq_tail.py'
permissions:
  contents: read
jobs:
  capture:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Capture public source responses without generating targets
        run: |
          python - <<'PY'
          import concurrent.futures,datetime,hashlib,json,pathlib,urllib.request,urllib.parse
          from zoneinfo import ZoneInfo
          out=pathlib.Path('qqq_source_capture');out.mkdir(exist_ok=True)
          now=datetime.datetime.now(datetime.timezone.utc)
          date=now.astimezone(ZoneInfo('America/New_York')).date()
          finish=datetime.datetime.combine(date+datetime.timedelta(days=1),datetime.time(),ZoneInfo('America/New_York'))
          common={'interval':'1d','events':'div,splits','includePrePost':'false'}
          base='https://query1.finance.yahoo.com/v8/finance/chart/QQQ'
          sources=[('yahoo_full',base,{**common,'period1':920246400,'period2':int(finish.timestamp())}),
                   ('yahoo_5d',base,{**common,'range':'5d'}),
                   ('yahoo_history',base,{'interval':'1d','range':'3mo','events':'history'}),
                   ('yahoo_intraday',base,{'interval':'5m','range':'5d','includePrePost':'false'})]
          for kind in ['etf','stocks']:
            sources.append(('nasdaq_'+kind,'https://api.nasdaq.com/api/quote/QQQ/historical',{'assetclass':kind,'fromdate':str(date-datetime.timedelta(days=60)),'todate':str(date),'limit':100}))
          sources.extend([('stockanalysis_html','https://stockanalysis.com/etf/qqq/history/',{}),
                          ('financialcontent_html','https://markets.financialcontent.com/stocks/quote/historical',{'Symbol':'NQ:QQQ','Range':'3M'}),
                          ('invesco_html','https://www.invesco.com/us/financial-products/etfs/product-detail',{'productId':'QQQ','audienceType':'Investor'})])
          def get(item):
            name,url,params=item
            if params:url+='?'+urllib.parse.urlencode(params)
            record={'name':name,'url':url,'at':now.isoformat()}
            try:
              accept='text/html,*/*' if name.endswith('_html') else 'application/json'
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':accept,'Cache-Control':'no-cache'}),timeout=30) as r:
                body=r.read(6000000);record.update(http_status=r.status,headers={k:v for k,v in r.headers.items() if k.lower() in ('date','age','cache-control')})
              (out/(name+'.txt')).write_bytes(body)
              record.update(status='downloaded',sha256=hashlib.sha256(body).hexdigest(),bytes=len(body))
              if not name.endswith('_html'):
                obj=json.loads(body)
                if 'chart' in obj:
                  v=obj['chart']['result'][0];ts=v['timestamp'];q=v['indicators']['quote'][0]
                  record.update(meta=v.get('meta'),rows=len(ts),last_bars=[{'timestamp':t,**{k:x[i] for k,x in q.items()}} for i,t in list(enumerate(ts))[-3:]])
                else:record['sample']=str(obj)[:1500]
            except Exception as e:record.update(status='error',error=str(e))
            print(json.dumps(record));return record
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:records=list(pool.map(get,sources))
          (out/'manifest.json').write_text(json.dumps({'captured_at':now.isoformat(),'execution_authorized':False,'records':records},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qqq-source-capture-${{ github.run_id }}
          path: |
            qqq_source_capture/
            qld_tqqq_signal_monitor/
            .github/workflows/
          retention-days: 30
