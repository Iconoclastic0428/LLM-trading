name: QLD TQQQ monthly signal

on:
  schedule:
    # Explicit UTC. Hourly eligibility checks tolerate missed/delayed cron events.
    - cron: "7 * * * *"
  push:
    branches: [main]
    paths: ["qld_tqqq_signal_monitor/**", ".github/workflows/qld-tqqq-signal.yml"]
  workflow_dispatch:
    inputs:
      report_date:
        description: "Optional YYYY-MM-DD: historical audit ONLY, never publishes a trade"
        required: false
        type: string
  repository_dispatch:
    types: [qld-tqqq-check]

permissions:
  contents: read
  issues: write

concurrency:
  group: qld-tqqq-monthly-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select overnight check window
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          from datetime import datetime
          import os
          from zoneinfo import ZoneInfo
          pt = datetime.now(ZoneInfo('America/Los_Angeles'))
          # UTC cron is hourly; only PT 18:00-06:59 performs market-data work.
          # Include weekends/holidays for month-end catch-up; no intraday orders.
          eligible = os.environ['EVENT_NAME'] != 'schedule' or pt.hour >= 18 or pt.hour <= 6
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'run={str(eligible).lower()}\n')
          print(f'Actual runner time: {pt.isoformat()}; eligible={eligible}')
          PY
      - name: Set up Python
        if: steps.window.outputs.run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: qld_tqqq_signal_monitor/requirements.txt
      - name: Install dependencies
        if: steps.window.outputs.run == 'true'
        run: python -m pip install -r qld_tqqq_signal_monitor/requirements.txt
      - name: Run tests
        if: steps.window.outputs.run == 'true'
        run: python -m pytest qld_tqqq_signal_monitor/tests -q
      - name: Generate verified monthly signal
        if: steps.window.outputs.run == 'true'
        id: generate
        timeout-minutes: 10
        env:
          REPORT_DATE: ${{ inputs.report_date }}
        shell: bash
        run: |
          args=()
          if [[ -n "$REPORT_DATE" ]]; then args+=(--report-date "$REPORT_DATE"); fi
          python qld_tqqq_signal_monitor/exact_monitor.py "${args[@]}"
      - name: Publish signal and recovery status
        # Publisher handles missing output after setup/test failures and never
        # calls a failed/expired run healthy. No grep -q / pipefail dedup races.
        if: always() && steps.window.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
          REPORT_DATE: ${{ inputs.report_date }}
        run: |
          if [ -n "$REPORT_DATE" ]; then
            echo "Historical audit does not mutate production issue or heartbeat"
          else
            python qld_tqqq_signal_monitor/publish_status.py
          fi
      - name: Preserve audit outputs
        if: always() && steps.window.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qld-tqqq-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: signal_output/
          if-no-files-found: warn
          retention-days: 30
      - name: Add run summary
        if: always() && steps.window.outputs.run == 'true'
        run: |
          if [ -f signal_output/report.md ]; then cat signal_output/report.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f signal_output/publication.json ]; then cat signal_output/publication.json >> "$GITHUB_STEP_SUMMARY"; fi
