name: QLD TQQQ monthly signal
run-name: "Monthly BASE / C20 / Q70 audit (${{ github.event_name }})"

on:
  schedule:
    # UTC fallback opportunities twice hourly; delivery is still best-effort.
    - cron: "7,37 * * * *"
  push:
    branches: [main]
    paths: ["qld_tqqq_signal_monitor/**", ".github/workflows/qld-tqqq-signal.yml"]
  workflow_dispatch:
    inputs:
      report_date:
        description: "Optional YYYY-MM-DD: historical audit ONLY, never publishes a trade"
        required: false
        type: string
  repository_dispatch:
    types: [qld-tqqq-check]

permissions:
  contents: read
  issues: write

concurrency:
  group: qld-tqqq-monthly-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select post-close check window and record eligibility
        id: window
        env:
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: python qld_tqqq_signal_monitor/run_window.py
      - name: Set up Python
        if: steps.window.outputs.run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: qld_tqqq_signal_monitor/requirements.txt
      - name: Install dependencies
        if: steps.window.outputs.run == 'true'
        run: python -m pip install -r qld_tqqq_signal_monitor/requirements.txt
      - name: Run tests
        if: steps.window.outputs.run == 'true'
        run: python -m pytest qld_tqqq_signal_monitor/tests -q
      - name: Restore verified full-history checkpoint
        if: steps.window.outputs.run == 'true' && !inputs.report_date
        id: checkpoint
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: price_checkpoint/
          key: verified-prices-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            verified-prices-v1-
      - name: Generate verified monthly signal
        if: steps.window.outputs.run == 'true'
        id: generate
        timeout-minutes: 10
        env:
          REPORT_DATE: ${{ inputs.report_date }}
          PRICE_CHECKPOINT_DIR: ${{ !inputs.report_date && 'price_checkpoint' || '' }}
          SOURCE_EVIDENCE_DIR: source_evidence
        shell: bash
        run: |
          args=()
          if [[ -n "$REPORT_DATE" ]]; then args+=(--report-date "$REPORT_DATE"); fi
          python qld_tqqq_signal_monitor/exact_monitor.py "${args[@]}"
      - name: Publish signal and recovery status
        # Publisher handles missing output after setup/test failures and never
        # calls a failed/expired run healthy. No grep -q / pipefail dedup races.
        if: always() && steps.window.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
          REPORT_DATE: ${{ inputs.report_date }}
        run: |
          if [ -n "$REPORT_DATE" ]; then
            echo "Historical audit does not mutate production issue or heartbeat"
          else
            python qld_tqqq_signal_monitor/publish_status.py
          fi
      - name: Preserve audit outputs
        if: always() && steps.window.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qld-tqqq-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: signal_output/
          if-no-files-found: warn
          retention-days: 30
      - name: Add run summary
        if: always() && steps.window.outputs.run == 'true'
        run: |
          if [ -f signal_output/report.md ]; then cat signal_output/report.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f signal_output/publication.json ]; then cat signal_output/publication.json >> "$GITHUB_STEP_SUMMARY"; fi
      # Production publication and its audit are complete before shadow work starts.
      # A shadow failure must not block or replace the BASE monthly notification.
      - name: Compare C20 and Q70 shadow targets
        if: always() && steps.generate.outcome == 'success'
        id: shadow
        continue-on-error: true
        timeout-minutes: 4
        env:
          VIX_SHADOW_ENABLED: ${{ vars.VIX_SHADOW_ENABLED || 'true' }}
        run: python qld_tqqq_signal_monitor/vix_shadow.py
      - name: Preserve separate shadow audit
        if: always() && steps.generate.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: qld-tqqq-vix-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: shadow_output/
          if-no-files-found: warn
          retention-days: 90
      - name: Add shadow status without changing production status
        if: always() && steps.generate.outcome == 'success'
        env:
          SHADOW_OUTCOME: ${{ steps.shadow.outcome }}
        run: |
          if [ -f shadow_output/report.md ]; then cat shadow_output/report.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$SHADOW_OUTCOME" != "success" ]; then
            echo "::warning::Shadow validation failed or timed out; BASE output is unchanged."
            echo "Shadow step outcome: $SHADOW_OUTCOME. No valid shadow target should be inferred." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save verified full-history checkpoint after production processing
        if: always() && steps.generate.outcome == 'success' && !inputs.report_date
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: price_checkpoint/
          key: verified-prices-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve source and checkpoint audit
        if: always() && steps.window.outputs.run == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: verified-price-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source_evidence/
            price_checkpoint/
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve scheduler decision even when market-data work was skipped
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: qld-tqqq-run-window-${{ github.run_id }}-${{ github.run_attempt }}
          path: run_window_audit/
          if-no-files-found: warn
          retention-days: 30
