name: Research published GEM reference image
on:
  push:
    branches: [research/gem-fundamentals-20260904]
    paths: [.github/workflows/research-gem-fundamentals.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Retrieve publisher public image
        run: |
          python -m pip install -q requests
          mkdir -p /tmp/gem-image
          python - <<'PY'
          import requests,json,hashlib
          from pathlib import Path
          root=Path('/tmp/gem-image');log=[]
          path='/wp-content/uploads/elementor/thumbs/Screenshot-2026-07-21-172943-rqraqs1oyuor1h65kijwfuf4nfxqmbamv3z3rrieea.png'
          for host in ['optimalmomentum.com','www.optimalmomentum.com']:
            url='https://'+host+path
            try:
              r=requests.get(url,headers={'User-Agent':'Mozilla/5.0 quantitative-research','Referer':'https://www.optimalmomentum.com/global-equities-momentum/'},timeout=35);r.raise_for_status()
              assert r.content.startswith(b'\x89PNG')
              (root/'gem_published_returns.png').write_bytes(r.content)
              log.append({'url':url,'sha256':hashlib.sha256(r.content).hexdigest()});break
            except Exception as e:log.append({'url':url,'error':str(e)})
          (root/'manifest.json').write_text(json.dumps(log,indent=2));print(json.dumps(log,indent=2))
          PY
      - name: Archive reference
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gem-published-image
          path: /tmp/gem-image
          retention-days: 7
