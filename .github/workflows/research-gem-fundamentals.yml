name: Research selected public SUE inputs
on:
  push:
    branches: [research/gem-fundamentals-20260904]
    paths: [.github/workflows/research-gem-fundamentals.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch documented public data
        run: |
          python -m pip install -q requests
          mkdir -p /tmp/selected-inputs
          python - <<'PY'
          import requests,zipfile,io,json,hashlib,re
          from pathlib import Path
          root=Path('/tmp/selected-inputs');log=[]
          headers={'User-Agent':'Mozilla/5.0 quantitative-research'}
          for filename in ['me_mom_monthly_2025.zip','me_mom_daily_2025.zip']:
            for host in ['global-q.org','www.global-q.org']:
              url=f'https://{host}/uploads/1/2/2/6/122679606/{filename}'
              try:
                r=requests.get(url,headers=headers,timeout=90);r.raise_for_status()
                z=zipfile.ZipFile(io.BytesIO(r.content));selected=[]
                (root/(filename+'.names.json')).write_text(json.dumps(z.namelist(),indent=2))
                for member in z.namelist():
                  if 'sue_1' in member.lower() and member.lower().endswith('.csv'):
                    out=Path(member).name;data=z.read(member);(root/out).write_bytes(data);selected.append(out)
                log.append({'url':url,'sha256':hashlib.sha256(r.content).hexdigest(),'selected':selected});break
              except Exception as e:log.append({'url':url,'error':str(e)})
          (root/'manifest_retry.json').write_text(json.dumps(log,indent=2));print(json.dumps(log,indent=2))
          PY
      - name: Archive selected files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sue-selected-inputs
          path: /tmp/selected-inputs
          retention-days: 7
